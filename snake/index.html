<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake — Retro Arcade</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #04000c;
      font-family: 'Courier New', monospace;
      color: #fff;
      min-height: 100vh;
      display: flex; justify-content: center; align-items: flex-start;
      overflow-x: hidden;
    }
    body::after {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(transparent, transparent 3px, rgba(0,0,0,.12) 3px, rgba(0,0,0,.12) 4px);
      pointer-events: none; z-index: 999;
    }
    #bgCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    #app {
      position: relative; z-index: 1;
      width: 100%; max-width: 960px;
      padding: 20px 20px 40px;
      display: flex; flex-direction: column; align-items: center;
    }

    /* ── Top bar ── */
    .top-bar {
      width: 100%; display: flex;
      justify-content: space-between; align-items: center;
      margin-bottom: 6px;
    }
    .home-btn {
      font-family: 'Courier New', monospace;
      font-size: 11px; color: #444; background: transparent;
      border: 1px solid #333; padding: 5px 12px; cursor: pointer;
      letter-spacing: 1px; text-decoration: none;
      transition: color .15s, border-color .15s; display: inline-block;
    }
    .home-btn:hover { color: #aaa; border-color: #aaa; }

    /* ── Title ── */
    .game-title {
      font-size: clamp(24px, 4.5vw, 44px);
      letter-spacing: 6px; text-align: center;
      color: #ffe600;
      text-shadow: 3px 3px 0 #ff2d78, 6px 6px 0 #cc0055, 9px 9px 0 rgba(180,0,60,.3);
      margin: 8px 0 24px;
    }

    .screen { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 16px; }

    /* ── MENU ── */
    .menu-section-label { font-size: 9px; color: #444; letter-spacing: 4px; margin-bottom: 8px; text-align: center; }
    .diff-btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .diff-btn {
      padding: 10px 28px; font-family: 'Courier New', monospace;
      font-size: 12px; letter-spacing: 3px; cursor: pointer;
      background: #080808; border: 2px solid #333; color: #555;
      transition: all .15s;
    }
    .diff-btn:hover { border-color: #ffe600; color: #ffe600; }
    .diff-btn.easy.active   { background: #001a00; border-color: #00ff88; color: #00ff88; box-shadow: 0 0 14px #00ff8844; }
    .diff-btn.medium.active { background: #1a0e00; border-color: #ffaa00; color: #ffaa00; box-shadow: 0 0 14px #ffaa0044; }
    .diff-btn.hard.active   { background: #1a0008; border-color: #ff2d78; color: #ff2d78; box-shadow: 0 0 14px #ff2d7844; }


    .diff-info { font-size: 9px; color: #333; letter-spacing: 1.5px; text-align: center; min-height: 14px; }

    .start-btn {
      padding: 14px 48px; font-family: 'Courier New', monospace;
      font-size: 15px; letter-spacing: 4px; cursor: pointer;
      background: transparent; border: 2px solid #ffe600; color: #ffe600;
      transition: all .15s;
    }
    .start-btn:hover { background: #ffe60018; box-shadow: 0 0 20px #ffe60055; }

    .menu-divider { width: 100%; border: none; border-top: 1px solid #1a1a1a; max-width: 560px; }

    /* ── Leaderboard ── */
    .lb-wrap { width: 100%; max-width: 560px; }
    .lb-title { font-size: 9px; letter-spacing: 4px; color: #444; text-align: center; margin-bottom: 10px; }
    .lb-table {
      width: 100%; border-collapse: collapse;
      font-size: 11px; letter-spacing: 1.5px;
    }
    .lb-table th {
      font-size: 8px; color: #333; letter-spacing: 3px;
      padding: 4px 8px; border-bottom: 1px solid #1a1a1a; text-align: left;
    }
    .lb-table th.r { text-align: right; }
    .lb-table td { padding: 5px 8px; color: #445; border-bottom: 1px solid #0d0d0d; }
    .lb-table td.rank { color: #333; font-size: 9px; }
    .lb-table td.name { color: #6a7090; }
    .lb-table td.score { text-align: right; color: #3a5040; font-weight: bold; }
    .lb-table tr.gold   td { color: #ffe600; }
    .lb-table tr.gold   td.score { color: #ffe600; text-shadow: 0 0 8px #ffe60066; }
    .lb-table tr.silver td { color: #aaaacc; }
    .lb-table tr.silver td.score { color: #aaaacc; }
    .lb-table tr.bronze td { color: #cc8844; }
    .lb-table tr.bronze td.score { color: #cc8844; }
    .lb-table tr.highlight td { color: #00ff88 !important; }
    .lb-table tr.highlight td.score { text-shadow: 0 0 8px #00ff8866; }
    .lb-empty { font-size: 9px; color: #222; letter-spacing: 3px; text-align: center; padding: 16px 0; }

    /* ── GAME ── */
    .stats-bar { display: flex; gap: 32px; justify-content: center; flex-wrap: wrap; }
    .stat-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .stat-label { font-size: 8px; color: #333; letter-spacing: 3px; }
    .stat-val { font-size: 22px; font-weight: bold; }
    .stat-val.green  { color: #00ff88; text-shadow: 0 0 10px #00ff8866; }
    .stat-val.cyan   { color: #00f5ff; text-shadow: 0 0 10px #00f5ff66; }
    .stat-val.yellow { color: #ffd700; text-shadow: 0 0 10px #ffd70066; }
    .stat-val.dim    { color: #334; }

    #gameCanvas {
      display: block;
      border: 1px solid #0a0a1a;
      box-shadow: 0 0 20px #00ff8814;
      background: #010008;
    }

    .game-hint { font-size: 9px; color: #222; letter-spacing: 2px; text-align: center; }

    /* ── Buttons ── */
    .action-btn {
      padding: 10px 32px; font-family: 'Courier New', monospace;
      font-size: 12px; letter-spacing: 3px; cursor: pointer;
      background: #080808; border: 1px solid #333; color: #555; transition: all .15s;
    }
    .action-btn:hover { border-color: #aaa; color: #aaa; }
    .action-btn.primary { border-color: #ffe600; color: #ffe600; }
    .action-btn.primary:hover { background: #ffe60018; box-shadow: 0 0 14px #ffe60044; }
    .btn-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

    /* ── RESULT ── */
    #resultScreen { gap: 14px; }
    .result-title { font-size: clamp(28px, 6vw, 54px); font-weight: bold; letter-spacing: 4px; text-align: center; }
    .result-sub   { font-size: 11px; letter-spacing: 3px; color: #555; text-align: center; }
    .result-score { font-size: 20px; font-weight: bold; color: #00ff88; text-shadow: 0 0 12px #00ff8866; letter-spacing: 3px; }
    .result-rank  { font-size: 11px; letter-spacing: 2px; color: #ffd700; text-shadow: 0 0 8px #ffd70066; min-height: 18px; text-align: center; }


    /* ── Name Entry Modal ── */
    #nameModal {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,.88);
      display: flex; align-items: center; justify-content: center;
    }
    #nameModal.hidden { display: none; }
    .name-box {
      background: #06000f;
      border: 2px solid #cc00ff;
      box-shadow: 0 0 40px #cc00ff44;
      padding: 36px 40px;
      display: flex; flex-direction: column; align-items: center; gap: 18px;
      max-width: 380px; width: 90%;
    }
    .name-box h2 {
      font-size: 13px; color: #cc00ff; letter-spacing: 3px; text-align: center;
      text-shadow: 0 0 10px #cc00ff88;
    }
    .name-box .sub {
      font-size: 9px; color: #555; letter-spacing: 2px; text-align: center; line-height: 2;
    }
    .name-box .rank-badge {
      font-size: 11px; color: #ffd700; letter-spacing: 2px;
      border: 1px solid #ffd70055; padding: 4px 16px;
    }
    #nameInput {
      background: #000; border: 2px solid #cc00ff; color: #cc00ff;
      font-family: 'Courier New', monospace;
      font-size: 18px; letter-spacing: 6px; padding: 10px 16px;
      text-align: center; text-transform: uppercase; width: 260px; outline: none;
      box-shadow: 0 0 12px rgba(204,0,255,.2);
    }
    #nameInput::placeholder { color: #330044; letter-spacing: 3px; font-size: 12px; }
    .name-submit {
      padding: 10px 32px; font-family: 'Courier New', monospace;
      font-size: 13px; letter-spacing: 3px; cursor: pointer;
      background: transparent; border: 2px solid #cc00ff; color: #cc00ff;
      transition: all .15s;
    }
    .name-submit:hover { background: #cc00ff22; box-shadow: 0 0 18px #cc00ff88; }
    .name-skip {
      font-size: 9px; color: #333; letter-spacing: 2px; cursor: pointer; background: none; border: none;
      transition: color .15s;
    }
    .name-skip:hover { color: #777; }
  </style>
</head>
<body>
<canvas id="bgCanvas"></canvas>

<!-- ── Name Entry Modal ── -->
<div id="nameModal" class="hidden">
  <div class="name-box">
    <h2>NEW HIGH SCORE!</h2>
    <div class="rank-badge" id="modalRank"></div>
    <div class="sub" id="modalSub"></div>
    <input id="nameInput" maxlength="12" placeholder="ENTER NAME" autocomplete="off" spellcheck="false">
    <button class="name-submit" onclick="submitName()">SAVE SCORE</button>
    <button class="name-skip" onclick="skipName()">SKIP</button>
  </div>
</div>

<div id="app">

  <!-- ── MENU ── -->
  <div id="menuScreen" class="screen">
    <div class="top-bar">
      <a class="home-btn" href="../index.html">← ARCADE</a>
      <span></span>
    </div>
    <h1 class="game-title">SNAKE</h1>

    <div class="menu-section-label">DIFFICULTY</div>
    <div class="diff-btns">
      <button class="diff-btn easy"   onclick="setDiff('easy',   this)">EASY</button>
      <button class="diff-btn medium" onclick="setDiff('medium', this)">MEDIUM</button>
      <button class="diff-btn hard"   onclick="setDiff('hard',   this)">HARD</button>
    </div>
    <div class="diff-info" id="diffInfo"></div>

    <hr class="menu-divider">
    <button class="start-btn" onclick="startGame()">START GAME</button>
    <hr class="menu-divider">

    <!-- Leaderboard on menu -->
    <div class="lb-wrap" id="menuLbWrap">
      <div class="lb-title" id="menuLbTitle">TOP SCORES — EASY</div>
      <div id="menuLb"></div>
    </div>

    <a class="home-btn" href="../index.html" style="margin-top:8px">← BACK TO ARCADE</a>
  </div>

  <!-- ── GAME ── -->
  <div id="gameScreen" class="screen" style="display:none">
    <div class="top-bar">
      <button class="action-btn" onclick="goMenu()">← MENU</button>
      <div class="stats-bar" id="statsBar">
        <!-- filled dynamically -->
      </div>
      <button class="action-btn" onclick="startGame()">NEW</button>
    </div>

    <canvas id="gameCanvas" width="480" height="480"></canvas>
    <div class="game-hint" id="gameHint"></div>
  </div>

  <!-- ── RESULT ── -->
  <div id="resultScreen" class="screen" style="display:none">
    <div class="top-bar">
      <a class="home-btn" href="../index.html">← ARCADE</a>
      <span></span>
    </div>
    <h1 class="game-title">SNAKE</h1>
    <div class="result-title" id="resultTitle">GAME OVER</div>
    <div class="result-sub"   id="resultSub"></div>

    <div style="display:flex; flex-direction:column; align-items:center; gap:10px;">
      <div class="result-score" id="resultScore"></div>
      <div class="result-rank"  id="resultRank"></div>
    </div>

    <div class="lb-wrap" id="resultLbWrap" style="display:none">
      <div class="lb-title" id="resultLbTitle">TOP SCORES</div>
      <div id="resultLb"></div>
    </div>

    <div class="btn-row">
      <button class="action-btn primary" onclick="startGame()">PLAY AGAIN</button>
      <button class="action-btn" onclick="goMenu()">MENU</button>
      <a class="action-btn" href="../index.html">ARCADE</a>
    </div>
  </div>

</div>

<script>
// ═══════════════════════════════════════════════════════════════
// STARFIELD
// ═══════════════════════════════════════════════════════════════
(function() {
  const cv = document.getElementById('bgCanvas');
  const cx = cv.getContext('2d');
  let stars = [];

  function resize() {
    cv.width  = window.innerWidth;
    cv.height = window.innerHeight;
  }

  function initStars() {
    stars = [];
    for (let i = 0; i < 120; i++) {
      stars.push({
        x: Math.random() * cv.width,
        y: Math.random() * cv.height,
        r: Math.random() * 1.2 + 0.2,
        base: Math.random(),
        speed: 0.3 + Math.random() * 0.7,
        phase: Math.random() * Math.PI * 2,
      });
    }
  }

  let t = 0;
  function draw() {
    cx.clearRect(0, 0, cv.width, cv.height);
    t += 0.016;
    for (const s of stars) {
      const alpha = 0.15 + s.base * 0.55 + Math.sin(t * s.speed + s.phase) * 0.3;
      cx.beginPath();
      cx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      cx.fillStyle = `rgba(255,255,255,${Math.max(0, Math.min(1, alpha))})`;
      cx.fill();
    }
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', () => { resize(); initStars(); });
  resize();
  initStars();
  draw();
})();

// ═══════════════════════════════════════════════════════════════
// CONSTANTS & CONFIG
// ═══════════════════════════════════════════════════════════════
const GRID = 20;
const CELL = 24;
const CANVAS_SIZE = GRID * CELL; // 480

const DIFF_CFG = {
  easy:   { wrapWalls: true,  baseMs: 150, obstacles: 0,  label: 'WALLS WRAP · SLOWER SPEED' },
  medium: { wrapWalls: false, baseMs: 100, obstacles: 0,  label: 'WALLS KILL · MEDIUM SPEED' },
  hard:   { wrapWalls: false, baseMs: 70,  obstacles: 8,  label: 'WALLS KILL · FAST SPEED · OBSTACLES' },
};

const DIR = { UP:[0,-1], DOWN:[0,1], LEFT:[-1,0], RIGHT:[1,0] };
const OPPOSITE = { UP:'DOWN', DOWN:'UP', LEFT:'RIGHT', RIGHT:'LEFT' };

const COL_P1   = '#00ff88';
const COL_P1H  = '#00cc66';  // head highlight
const COL_P2   = '#00f5ff';
const COL_P2H  = '#00bbcc';
const COL_FOOD = '#ff2d78';
const COL_OBS  = '#1a1a2a';
const COL_GRID = '#08000f';

const LB_KEY = 'snake_lb_v1';

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
// single player only
let difficulty = 'easy';
let gameState  = 'menu'; // menu | playing | paused | over

// Snake objects
function mkSnake(startX, startY, dir) {
  return {
    body: [
      { x: startX, y: startY },
      { x: startX - DIR[dir][0], y: startY - DIR[dir][1] },
      { x: startX - DIR[dir][0]*2, y: startY - DIR[dir][1]*2 },
    ],
    dir: dir,
    nextDir: dir,
    dirQueue: [],
    alive: true,
    score: 0,
    grow: 0,
  };
}

let snake1;
let food = null;
let obstacles = [];
let tickMs = 150;
let tickTimer = null;
let totalFood = 0; // combined food eaten for speed scaling

// ── Pending result state for name entry
let pendingScore = 0;
let pendingDiff  = 'easy';

// ═══════════════════════════════════════════════════════════════
// LEADERBOARD
// ═══════════════════════════════════════════════════════════════
function loadLb() {
  try {
    const raw = localStorage.getItem(LB_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d.easy && d.medium && d.hard) return d;
    }
  } catch(e) {}
  return { easy: [], medium: [], hard: [] };
}

function saveLb(lb) {
  localStorage.setItem(LB_KEY, JSON.stringify(lb));
}

function lbRank(score, diff) {
  const lb = loadLb();
  const entries = lb[diff];
  // What position would this score land?
  let pos = entries.filter(e => e.score > score).length + 1;
  if (pos > 10 && entries.length >= 10) return -1;
  return pos;
}

function lbInsert(name, score, diff) {
  const lb = loadLb();
  lb[diff].push({ name, score });
  lb[diff].sort((a, b) => b.score - a.score);
  lb[diff] = lb[diff].slice(0, 10);
  saveLb(lb);
}

function renderLbTable(diff, highlightScore) {
  const lb = loadLb();
  const entries = lb[diff];
  if (!entries.length) return `<div class="lb-empty">NO SCORES YET</div>`;
  const rankClass = ['gold','silver','bronze'];
  let rows = entries.map((e, i) => {
    let cls = i < 3 ? rankClass[i] : '';
    if (highlightScore !== undefined && e.score === highlightScore && !cls) cls = 'highlight';
    return `<tr class="${cls}">
      <td class="rank">#${i+1}</td>
      <td class="name">${e.name || 'AAA'}</td>
      <td class="score">${e.score}</td>
    </tr>`;
  }).join('');
  return `<table class="lb-table">
    <thead><tr>
      <th>#</th><th>NAME</th><th class="r">SCORE</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

// ═══════════════════════════════════════════════════════════════
// MENU
// ═══════════════════════════════════════════════════════════════
function setMode(n, btn) {
  updateDiffInfo();
}

function setDiff(d, btn) {
  difficulty = d;
  document.querySelectorAll('.diff-btn.easy, .diff-btn.medium, .diff-btn.hard').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updateDiffInfo();
  updateMenuLb();
}

function updateDiffInfo() {
  document.getElementById('diffInfo').textContent = DIFF_CFG[difficulty].label;
}

function updateMenuLb() {
  document.getElementById('menuLbTitle').textContent = `TOP SCORES — ${difficulty.toUpperCase()}`;
  document.getElementById('menuLb').innerHTML = renderLbTable(difficulty);
}

// ═══════════════════════════════════════════════════════════════
// SCREEN MANAGEMENT
// ═══════════════════════════════════════════════════════════════
function showScreen(id) {
  ['menuScreen','gameScreen','resultScreen'].forEach(s => {
    document.getElementById(s).style.display = (s === id) ? 'flex' : 'none';
  });
}

function goMenu() {
  stopTick();
  gameState = 'menu';
  showScreen('menuScreen');
  updateMenuLb();
}

// ═══════════════════════════════════════════════════════════════
// GAME INIT
// ═══════════════════════════════════════════════════════════════
function startGame() {
  stopTick();
  gameState = 'playing';
  totalFood = 0;

  const cfg = DIFF_CFG[difficulty];
  tickMs = cfg.baseMs;

  snake1 = mkSnake(4, 10, 'RIGHT');

  // Generate obstacles (hard mode)
  obstacles = [];
  if (cfg.obstacles > 0) {
    while (obstacles.length < cfg.obstacles) {
      const ox = Math.floor(Math.random() * GRID);
      const oy = Math.floor(Math.random() * GRID);
      // keep away from snake starts
      if (ox < 8 && oy >= 7 && oy <= 12) continue;
      if (ox > 11 && oy >= 7 && oy <= 12) continue;
      if (!obstacles.find(o => o.x === ox && o.y === oy)) {
        obstacles.push({ x: ox, y: oy });
      }
    }
  }

  spawnFood();
  buildStatsBar();
  updateStatsBar();

  document.getElementById('gameHint').textContent = '← → ↑ ↓  ARROW KEYS  /  WASD';

  showScreen('gameScreen');
  startTick();
}

// ═══════════════════════════════════════════════════════════════
// STATS BAR
// ═══════════════════════════════════════════════════════════════
function buildStatsBar() {
  const bar = document.getElementById('statsBar');
  bar.innerHTML = `
    <div class="stat-item">
      <span class="stat-label">SCORE</span>
      <span class="stat-val green" id="statScore">0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">HI-SCORE</span>
      <span class="stat-val yellow" id="statHi">0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">SPEED</span>
      <span class="stat-val dim" id="statSpeed">1</span>
    </div>`;
}

function getHiScore() {
  const lb = loadLb();
  const entries = lb[difficulty];
  if (!entries.length) return 0;
  return entries[0].score;
}

function updateStatsBar() {
  const el = document.getElementById('statScore');
  if (el) el.textContent = snake1.score;
  const hi = document.getElementById('statHi');
  if (hi) hi.textContent = Math.max(getHiScore(), snake1.score);
  const sp = document.getElementById('statSpeed');
  if (sp) sp.textContent = Math.floor(totalFood / 5) + 1;
}

// ═══════════════════════════════════════════════════════════════
// FOOD & OBSTACLES
// ═══════════════════════════════════════════════════════════════
function occupiedCells() {
  const set = new Set();
  const key = (x, y) => `${x},${y}`;
  if (snake1) snake1.body.forEach(c => set.add(key(c.x, c.y)));
  obstacles.forEach(o => set.add(key(o.x, o.y)));
  if (food) set.add(key(food.x, food.y));
  return set;
}

function spawnFood() {
  food = null; // clear before computing occupied so old position is available
  const occ = occupiedCells();
  const key = (x, y) => `${x},${y}`;
  let attempts = 0;
  while (attempts < 400) {
    const x = Math.floor(Math.random() * GRID);
    const y = Math.floor(Math.random() * GRID);
    if (!occ.has(key(x, y))) {
      food = { x, y };
      return;
    }
    attempts++;
  }
  food = null; // board full
}

// ═══════════════════════════════════════════════════════════════
// TICK / GAME LOGIC
// ═══════════════════════════════════════════════════════════════
function startTick() {
  tickTimer = setInterval(tick, tickMs);
}

function stopTick() {
  if (tickTimer !== null) { clearInterval(tickTimer); tickTimer = null; }
}

function restartTick() {
  stopTick();
  startTick();
}

function applyQueue(snake) {
  if (!snake || !snake.alive) return;
  while (snake.dirQueue.length) {
    const nd = snake.dirQueue.shift();
    if (nd !== OPPOSITE[snake.dir]) {
      snake.dir = nd;
      break;
    }
  }
}

function moveSnake(snake) {
  if (!snake || !snake.alive) return;
  applyQueue(snake);

  const head = snake.body[0];
  let nx = head.x + DIR[snake.dir][0];
  let ny = head.y + DIR[snake.dir][1];

  const cfg = DIFF_CFG[difficulty];

  if (cfg.wrapWalls) {
    nx = ((nx % GRID) + GRID) % GRID;
    ny = ((ny % GRID) + GRID) % GRID;
  } else {
    if (nx < 0 || nx >= GRID || ny < 0 || ny >= GRID) {
      snake.alive = false;
      return;
    }
  }

  // Obstacle collision
  if (obstacles.find(o => o.x === nx && o.y === ny)) {
    snake.alive = false;
    return;
  }

  // Self collision (skip tail tip if not growing, as it will move away)
  const selfHit = snake.body.slice(0, snake.grow > 0 ? snake.body.length : snake.body.length - 1)
    .some(c => c.x === nx && c.y === ny);
  if (selfHit) {
    snake.alive = false;
    return;
  }

  // Move
  snake.body.unshift({ x: nx, y: ny });
  if (snake.grow > 0) {
    snake.grow--;
  } else {
    snake.body.pop();
  }
}

function tick() {
  if (gameState !== 'playing') return;

  moveSnake(snake1);

  // Food eating
  if (food) {
    const eaters = [snake1].filter(s => s && s.alive);
    for (const s of eaters) {
      if (s.body[0].x === food.x && s.body[0].y === food.y) {
        s.score++;
        s.grow++;
        totalFood++;
        // Speed up every 5 food
        const newMs = Math.max(50, DIFF_CFG[difficulty].baseMs - Math.floor(totalFood / 5) * 10);
        if (newMs !== tickMs) {
          tickMs = newMs;
          restartTick();
          // restartTick calls tick again after delay so return here to avoid double-processing
          // Actually restartTick just resets interval so this tick finishes normally
        }
        spawnFood();
        break;
      }
    }
  }

  updateStatsBar();
  drawGame();

  // Check game over
  if (!snake1.alive) {
    stopTick();
    gameState = 'over';
    setTimeout(showResult, 400);
  }
}

// ═══════════════════════════════════════════════════════════════
// DRAW
// ═══════════════════════════════════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function drawGame() {
  ctx.fillStyle = COL_GRID;
  ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

  // Subtle grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.02)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= GRID; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, CANVAS_SIZE); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(CANVAS_SIZE, i * CELL); ctx.stroke();
  }

  // Obstacles
  for (const o of obstacles) {
    ctx.fillStyle = COL_OBS;
    ctx.fillRect(o.x * CELL + 1, o.y * CELL + 1, CELL - 2, CELL - 2);
    // inner detail
    ctx.fillStyle = '#0d0d1a';
    ctx.fillRect(o.x * CELL + 4, o.y * CELL + 4, CELL - 8, CELL - 8);
  }

  // Food
  if (food) {
    const fx = food.x * CELL + CELL / 2;
    const fy = food.y * CELL + CELL / 2;
    // Glow
    const grad = ctx.createRadialGradient(fx, fy, 1, fx, fy, CELL * 0.7);
    grad.addColorStop(0, 'rgba(255,45,120,0.4)');
    grad.addColorStop(1, 'rgba(255,45,120,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(fx, fy, CELL * 0.7, 0, Math.PI * 2);
    ctx.fill();
    // Dot
    ctx.fillStyle = COL_FOOD;
    ctx.shadowColor = COL_FOOD;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(fx, fy, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Snakes
  drawSnake(snake1, COL_P1, COL_P1H);
}

function drawSnake(snake, col, headCol) {
  if (!snake || !snake.body.length) return;
  const alpha = snake.alive ? 1.0 : 0.3;

  ctx.globalAlpha = alpha;

  // Body segments
  for (let i = snake.body.length - 1; i >= 1; i--) {
    const seg = snake.body[i];
    const t = i / snake.body.length;
    ctx.fillStyle = col;
    ctx.globalAlpha = alpha * (0.35 + 0.65 * (1 - t));
    ctx.fillRect(seg.x * CELL + 2, seg.y * CELL + 2, CELL - 4, CELL - 4);
  }

  // Head
  const head = snake.body[0];
  ctx.globalAlpha = alpha;
  ctx.fillStyle = headCol;
  ctx.shadowColor = col;
  ctx.shadowBlur = snake.alive ? 10 : 0;
  ctx.fillRect(head.x * CELL + 1, head.y * CELL + 1, CELL - 2, CELL - 2);

  // Eye detail on head
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#000';
  const d = snake.body[0];
  const dir = snake.dir;
  let ex1, ey1, ex2, ey2;
  const base = d.x * CELL + CELL / 2;
  const basey = d.y * CELL + CELL / 2;
  const off = 3;
  if (dir === 'RIGHT') { ex1 = base+5; ey1 = basey-off; ex2 = base+5; ey2 = basey+off; }
  else if (dir === 'LEFT') { ex1 = base-5; ey1 = basey-off; ex2 = base-5; ey2 = basey+off; }
  else if (dir === 'UP') { ex1 = base-off; ey1 = basey-5; ex2 = base+off; ey2 = basey-5; }
  else { ex1 = base-off; ey1 = basey+5; ex2 = base+off; ey2 = basey+5; }

  ctx.beginPath(); ctx.arc(ex1, ey1, 1.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(ex2, ey2, 1.5, 0, Math.PI*2); ctx.fill();

  ctx.globalAlpha = 1.0;
}

// ═══════════════════════════════════════════════════════════════
// RESULT SCREEN
// ═══════════════════════════════════════════════════════════════
function showResult() {
  showScreen('resultScreen');

  document.getElementById('resultTitle').textContent = 'GAME OVER';
  document.getElementById('resultSub').textContent = `DIFFICULTY: ${difficulty.toUpperCase()}`;
  document.getElementById('resultLbWrap').style.display = '';

  const score = snake1.score;
  document.getElementById('resultScore').textContent = `SCORE: ${score}`;

  pendingScore = score;
  pendingDiff  = difficulty;

  const rank = lbRank(score, difficulty);
  if (rank > 0) {
    document.getElementById('resultRank').textContent = '';
    document.getElementById('resultLbTitle').textContent = `TOP SCORES — ${difficulty.toUpperCase()}`;
    document.getElementById('resultLb').innerHTML = renderLbTable(difficulty);
    showNameModal(rank, score);
  } else {
    const hi = getHiScore();
    document.getElementById('resultRank').textContent = score >= hi ? 'NEW BEST!' : '';
    document.getElementById('resultLbTitle').textContent = `TOP SCORES — ${difficulty.toUpperCase()}`;
    document.getElementById('resultLb').innerHTML = renderLbTable(difficulty);
  }
}

// ═══════════════════════════════════════════════════════════════
// NAME MODAL
// ═══════════════════════════════════════════════════════════════
function showNameModal(rank, score) {
  const rankNames = ['','GOLD','SILVER','BRONZE'];
  document.getElementById('modalRank').textContent =
    rank <= 3 ? `RANK #${rank} — ${rankNames[rank]}` : `RANK #${rank}`;
  document.getElementById('modalSub').textContent = `YOUR SCORE: ${score}\nENTER YOUR NAME FOR THE LEADERBOARD`;
  document.getElementById('nameInput').value = '';
  document.getElementById('nameModal').classList.remove('hidden');
  setTimeout(() => document.getElementById('nameInput').focus(), 100);
}

function submitName() {
  const raw = document.getElementById('nameInput').value.trim().toUpperCase();
  const name = raw.substring(0, 12) || 'AAA';
  lbInsert(name, pendingScore, pendingDiff);
  document.getElementById('nameModal').classList.add('hidden');
  // Refresh leaderboard display
  const rank = loadLb()[pendingDiff].findIndex(e => e.name === name && e.score === pendingScore) + 1;
  document.getElementById('resultRank').textContent = rank === 1 ? 'NEW BEST!' : `RANK #${rank}`;
  document.getElementById('resultLb').innerHTML = renderLbTable(pendingDiff, pendingScore);
}

function skipName() {
  document.getElementById('nameModal').classList.add('hidden');
  document.getElementById('resultLb').innerHTML = renderLbTable(pendingDiff);
}

// ═══════════════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════════════
function queueDir(snake, dir) {
  if (!snake || !snake.alive) return;
  const last = snake.dirQueue.length ? snake.dirQueue[snake.dirQueue.length - 1] : snake.dir;
  if (dir === OPPOSITE[last]) return;
  if (snake.dirQueue.length < 2) snake.dirQueue.push(dir);
}

document.addEventListener('keydown', e => {
  if (gameState !== 'playing') return;

  switch (e.key) {
    case 'ArrowUp':    case 'w': case 'W': e.preventDefault(); queueDir(snake1, 'UP');    break;
    case 'ArrowDown':  case 's': case 'S': e.preventDefault(); queueDir(snake1, 'DOWN');  break;
    case 'ArrowLeft':  case 'a': case 'A': e.preventDefault(); queueDir(snake1, 'LEFT');  break;
    case 'ArrowRight': case 'd': case 'D': e.preventDefault(); queueDir(snake1, 'RIGHT'); break;
  }
});

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
(function init() {
  // Set default difficulty button active
  const easyBtn = document.querySelector('.diff-btn.easy');
  if (easyBtn) {
    easyBtn.classList.add('active');
    updateDiffInfo();
    updateMenuLb();
  }
  showScreen('menuScreen');
})();
</script>
