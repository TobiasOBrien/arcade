<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asteroids</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }
    #gameContainer { position: relative; }
    canvas { display: block; box-shadow: 0 0 40px #ffffff18; }

    #hud {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      pointer-events: none;
      color: #fff;
      font-size: 13px;
      letter-spacing: 1px;
    }
    #hud .mid { text-align: center; flex: 1; }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      background: rgba(0,0,0,0.82);
      color: #fff;
      text-align: center;
      gap: 16px;
    }
    #overlay h1 { font-size: 44px; letter-spacing: 6px; text-shadow: 0 0 20px #fff; }
    #overlay h2 { font-size: 28px; letter-spacing: 4px; }
    #overlay p  { font-size: 14px; color: #999; line-height: 1.9; max-width: 440px; }
    #overlay .sub { font-size: 12px; color: #666; }
    #overlay button {
      padding: 12px 40px;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      background: transparent;
      border: 2px solid #fff;
      color: #fff;
      cursor: pointer;
      letter-spacing: 3px;
      transition: all 0.15s;
    }
    #overlay button:hover { background: #ffffff22; box-shadow: 0 0 20px #fff; }
    #homeBtn {
      position: absolute;
      top: 10px; right: 16px;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      background: transparent;
      border: 1px solid #333;
      color: #444;
      padding: 4px 10px;
      cursor: pointer;
      letter-spacing: 1px;
      z-index: 10;
      transition: color 0.15s, border-color 0.15s;
    }
    #homeBtn:hover { color: #aaa; border-color: #aaa; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div id="gameContainer">
  <canvas id="canvas"></canvas>
  <div id="hud">
    <span id="scoreDisplay">SCORE: 000000</span>
    <span class="mid" id="levelDisplay">SECTOR I</span>
    <span id="livesDisplay"></span>
  </div>
  <div id="overlay">
    <h1>ASTEROIDS</h1>
    <p>Blast through 5 deadly sectors.<br>Destroy all asteroids to advance.<br>Watch out for the UFO!</p>
    <p class="sub">
      W / ↑ Thrust &nbsp;|&nbsp; A/D / ←→ Rotate &nbsp;|&nbsp; SPACE Shoot &nbsp;|&nbsp; ESC Pause
    </p>
    <button id="startBtn">START GAME</button>
    <a href="../index.html" style="font-size:11px;color:#444;text-decoration:none;letter-spacing:2px;">◀ ARCADE</a>
  </div>
  <button id="homeBtn" onclick="location.href='../index.html'">◀ ARCADE</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const W = 800, H = 600;
canvas.width = W; canvas.height = H;

// ── UI refs ──────────────────────────────────────────────────────────────────
const UI = {
  score:   document.getElementById('scoreDisplay'),
  level:   document.getElementById('levelDisplay'),
  lives:   document.getElementById('livesDisplay'),
  overlay: document.getElementById('overlay'),
  startBtn:document.getElementById('startBtn'),
};

// ── Audio ────────────────────────────────────────────────────────────────────
let audioCtx;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
function playNote(freq, type, dur, vol=0.1) {
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
function sfxShoot()      { playNote(1400,'square',0.07,0.07); }
function sfxBigAst()     { playNote(55,'sawtooth',0.5,0.22); }
function sfxMedAst()     { playNote(95,'sawtooth',0.3,0.18); }
function sfxSmallAst()   { playNote(190,'sawtooth',0.15,0.13); }
function sfxUFOHit()     { playNote(440,'sawtooth',0.3,0.2); }
function sfxDie()        { [280,230,180,140,100].forEach((f,i)=>setTimeout(()=>playNote(f,'sawtooth',0.28,0.22),i*90)); }
function sfxLevelUp()    { [392,523,659,784,1047].forEach((f,i)=>setTimeout(()=>playNote(f,'sine',0.3,0.18),i*110)); }
function sfxExtraLife()  { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>playNote(f,'sine',0.25,0.15),i*80)); }

// Ambient UFO beep  (called on a timer)
let ufoBeepTimer = 0;
function sfxUFOBeep(fast) {
  playNote(fast ? 480 : 340, 'sine', 0.08, 0.06);
}

// ── Level Configs ────────────────────────────────────────────────────────────
const LEVELS = [
  { title: 'SECTOR I',   count: 3, speed: 1.0,  ufo: false },
  { title: 'SECTOR II',  count: 4, speed: 1.1,  ufo: true,  ufoInterval: 1300, aimed: false, spread: 1 },
  { title: 'SECTOR III', count: 5, speed: 1.25, ufo: true,  ufoInterval: 950,  aimed: true,  spread: 1 },
  { title: 'SECTOR IV',  count: 6, speed: 1.4,  ufo: true,  ufoInterval: 700,  aimed: true,  spread: 2 },
  { title: 'SECTOR V',   count: 7, speed: 1.6,  ufo: true,  ufoInterval: 480,  aimed: true,  spread: 3 },
];

const RADII         = [0, 12, 25, 46];       // size index 1,2,3
const AST_POINTS    = [0, 100, 50, 20];
const UFO_POINTS    = 200;
const EXTRA_LIFE_AT = 5000;
const MAX_LIVES     = 6;

// ── Helpers ──────────────────────────────────────────────────────────────────
function wrap(v, max) { return ((v % max) + max) % max; }
function dist(ax,ay,bx,by) { const dx=ax-bx,dy=ay-by; return Math.sqrt(dx*dx+dy*dy); }
function randAngle() { return Math.random() * Math.PI * 2; }

function randVerts(r) {
  const n = 8 + Math.floor(Math.random() * 5);
  return Array.from({ length: n }, (_, i) => {
    const a = (i / n) * Math.PI * 2;
    const rv = r * (0.68 + Math.random() * 0.58);
    return [Math.cos(a) * rv, Math.sin(a) * rv];
  });
}

// ── State ────────────────────────────────────────────────────────────────────
let state, keys, particles, lastTime;

function newShip() {
  return {
    x: W/2, y: H/2, vx: 0, vy: 0,
    angle: -Math.PI / 2,
    thrusting: false,
    shootTimer: 0,
    invTimer: 180,
    dead: false,
    deadTimer: 0,
  };
}

function newAsteroid(x, y, size, vx, vy) {
  return { x, y, vx, vy, size, verts: randVerts(RADII[size]), rot: randAngle(), rotS: (Math.random()-.5)*0.045 };
}

function spawnAsteroids(count, speedMult) {
  const result = [];
  for (let i = 0; i < count; i++) {
    let x, y;
    do { x = Math.random()*W; y = Math.random()*H; }
    while (dist(x,y,W/2,H/2) < 170);
    const a = randAngle(), s = (0.6 + Math.random() * 1.0) * speedMult;
    result.push(newAsteroid(x, y, 3, Math.cos(a)*s, Math.sin(a)*s));
  }
  return result;
}

function initGame() {
  keys      = {};
  particles = [];
  state = {
    phase:      'menu',
    level:      0,
    score:      0,
    hiScore:    state?.hiScore ?? 0,
    lives:      3,
    nextExtra:  EXTRA_LIFE_AT,
    ship:       newShip(),
    asteroids:  [],
    bullets:    [],
    ufo:        null,
    ufoBullets: [],
    ufoTimer:   0,
    flashMsg:   null,
    flashTimer: 0,
  };
}

function loadLevel(idx) {
  const cfg = LEVELS[idx];
  state.level     = idx;
  state.ship      = newShip();
  state.asteroids = spawnAsteroids(cfg.count, cfg.speed);
  state.bullets   = [];
  state.ufoBullets= [];
  state.ufo       = null;
  state.ufoTimer  = 0;
  particles       = [];
  UI.level.textContent = cfg.title;
}

// ── Particles ─────────────────────────────────────────────────────────────────
function spawnParticles(x, y, color, count, speed=2.5) {
  for (let i = 0; i < count; i++) {
    const a = randAngle(), s = Math.random() * speed + 0.5;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, alpha: 1, size: Math.random()*2.5+0.5, color,
      decay: Math.random()*0.025+0.018 });
  }
}
function updateParticles(dt) {
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 0.04*dt;
    p.alpha -= p.decay*dt;
    if (p.alpha <= 0) particles.splice(i,1);
  }
}
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

// ── UFO ──────────────────────────────────────────────────────────────────────
function spawnUFO() {
  const fromLeft = Math.random() < 0.5;
  state.ufo = {
    x: fromLeft ? -30 : W+30,
    y: 60 + Math.random() * (H - 180),
    vx: fromLeft ? 1.8 : -1.8,
    vy: (Math.random() - 0.5) * 0.6,
    shootTimer: 60,
  };
}

// ── Kill / Respawn ────────────────────────────────────────────────────────────
function killShip() {
  if (state.ship.dead || state.ship.invTimer > 0) return;
  spawnParticles(state.ship.x, state.ship.y, '#00ffff', 20, 4);
  sfxDie();
  state.lives--;
  state.ship.dead = true;
  state.ship.deadTimer = 120;
  if (state.lives < 0) state.lives = 0;
}

function respawnShip() {
  if (state.lives <= 0) { triggerGameOver(); return; }
  state.ship = newShip();
}

function checkExtraLife() {
  if (state.score >= state.nextExtra) {
    state.lives = Math.min(MAX_LIVES, state.lives + 1);
    state.nextExtra += EXTRA_LIFE_AT;
    sfxExtraLife();
    showFlash('EXTRA LIFE!', '#ffee00', 120);
  }
}

function showFlash(msg, color, dur) {
  state.flashMsg   = msg;
  state.flashColor = color;
  state.flashTimer = dur;
}

// ── Game-phase helpers ────────────────────────────────────────────────────────
function triggerLevelUp() {
  state.phase = 'levelup';
  sfxLevelUp();
  const next = LEVELS[state.level + 1];
  const bonus = (state.level + 1) * 300;
  state.score += bonus;
  showOverlay(
    `<h2 style="color:#fff">SECTOR CLEARED</h2>
     <p style="color:#ffd700;font-size:18px">+${bonus} BONUS POINTS</p>
     <p>INCOMING: <strong style="color:#aaf">${next.title}</strong></p>
     <p>${next.ufo ? '⚠ UFO ACTIVITY DETECTED' : 'Denser asteroid field ahead'}</p>`,
    'NEXT SECTOR',
    () => { loadLevel(state.level + 1); state.phase = 'playing'; lastTime = performance.now(); }
  );
}

function triggerGameOver() {
  state.phase = 'gameover';
  if (state.score > state.hiScore) state.hiScore = state.score;
  showOverlay(
    `<h2 style="color:#ff4444">GAME OVER</h2>
     <p style="font-size:18px">SCORE: ${fmtScore(state.score)}</p>
     <p class="sub">HI-SCORE: ${fmtScore(state.hiScore)}</p>`,
    'PLAY AGAIN',
    () => { initGame(); loadLevel(0); state.phase = 'playing'; lastTime = performance.now(); }
  );
}

function triggerWin() {
  state.phase = 'win';
  if (state.score > state.hiScore) state.hiScore = state.score;
  sfxLevelUp();
  showOverlay(
    `<h1 style="color:#ffd700">VICTORY!</h1>
     <p>The asteroid field is clear.<br>Earth is safe... for now.</p>
     <p style="font-size:18px;color:#ffd700">FINAL SCORE: ${fmtScore(state.score)}</p>
     <p class="sub">HI-SCORE: ${fmtScore(state.hiScore)}</p>`,
    'PLAY AGAIN',
    () => { initGame(); loadLevel(0); state.phase = 'playing'; lastTime = performance.now(); }
  );
}

function fmtScore(n) { return n.toString().padStart(6,'0'); }

// ── Overlay ───────────────────────────────────────────────────────────────────
function clearOverlay() {
  UI.overlay.innerHTML = '';
  UI.overlay.classList.add('hidden');
}
function showOverlay(html, btnText, onBtn) {
  UI.overlay.innerHTML = html +
    `<button id="actBtn">${btnText}</button>
     <a href="../index.html" style="font-size:10px;color:#444;text-decoration:none;letter-spacing:2px;">◀ ARCADE</a>`;
  UI.overlay.classList.remove('hidden');
  document.getElementById('actBtn').onclick = () => { initAudio(); clearOverlay(); onBtn(); };
}

// ── Update ────────────────────────────────────────────────────────────────────
const THRUST       = 0.14;
const DRAG         = 0.994;
const ROTATE_SPD   = 0.063;
const BULLET_SPEED = 8.5;
const MAX_SPD      = 7.5;
const BULLET_LIFE  = 68;
const SHOOT_CD     = 13;

function update(ts) {
  const dt = Math.min((ts - lastTime) / 16.667, 3);
  lastTime = ts;

  if (state.phase !== 'playing') return;

  const cfg = LEVELS[state.level];
  const ship = state.ship;

  // ── Ship ──────────────────────────────────────────────────────────────────
  if (!ship.dead) {
    if (keys['ArrowLeft']  || keys['a']) ship.angle -= ROTATE_SPD * dt;
    if (keys['ArrowRight'] || keys['d']) ship.angle += ROTATE_SPD * dt;

    ship.thrusting = !!(keys['ArrowUp'] || keys['w'] || keys['W']);
    if (ship.thrusting) {
      ship.vx += Math.cos(ship.angle) * THRUST * dt;
      ship.vy += Math.sin(ship.angle) * THRUST * dt;
      const sp = Math.sqrt(ship.vx*ship.vx + ship.vy*ship.vy);
      if (sp > MAX_SPD) { ship.vx = ship.vx/sp*MAX_SPD; ship.vy = ship.vy/sp*MAX_SPD; }
    }
    const drag = Math.pow(DRAG, dt);
    ship.vx *= drag; ship.vy *= drag;
    ship.x = wrap(ship.x + ship.vx * dt, W);
    ship.y = wrap(ship.y + ship.vy * dt, H);
    if (ship.invTimer > 0) ship.invTimer -= dt;

    // Shoot
    ship.shootTimer -= dt;
    if ((keys[' '] || keys['Space']) && ship.shootTimer <= 0) {
      const bvx = ship.vx + Math.cos(ship.angle) * BULLET_SPEED;
      const bvy = ship.vy + Math.sin(ship.angle) * BULLET_SPEED;
      state.bullets.push({ x: ship.x+Math.cos(ship.angle)*18, y: ship.y+Math.sin(ship.angle)*18,
        vx: bvx, vy: bvy, life: BULLET_LIFE });
      ship.shootTimer = SHOOT_CD;
      sfxShoot();
    }
  } else {
    ship.deadTimer -= dt;
    if (ship.deadTimer <= 0) respawnShip();
  }

  // ── Bullets ───────────────────────────────────────────────────────────────
  for (let i = state.bullets.length-1; i >= 0; i--) {
    const b = state.bullets[i];
    b.x = wrap(b.x + b.vx*dt, W);
    b.y = wrap(b.y + b.vy*dt, H);
    b.life -= dt;
    if (b.life <= 0) state.bullets.splice(i,1);
  }

  // ── Asteroids move ────────────────────────────────────────────────────────
  for (const a of state.asteroids) {
    a.x = wrap(a.x + a.vx*dt, W);
    a.y = wrap(a.y + a.vy*dt, H);
    a.rot += a.rotS * dt;
  }

  // ── UFO ───────────────────────────────────────────────────────────────────
  if (cfg.ufo && !state.ufo) {
    state.ufoTimer += dt;
    if (state.ufoTimer >= cfg.ufoInterval) { spawnUFO(); state.ufoTimer = 0; }
  }
  if (state.ufo) {
    const ufo = state.ufo;
    ufo.x += ufo.vx * dt;
    ufo.y += ufo.vy * dt;
    if (ufo.y < 50 || ufo.y > H - 60) ufo.vy *= -1;
    if (ufo.x < -60 || ufo.x > W + 60) { state.ufo = null; }
    else {
      // UFO sound
      ufoBeepTimer += dt;
      const fast = (state.lives <= 1);
      if (ufoBeepTimer >= (fast ? 20 : 35)) { sfxUFOBeep(fast); ufoBeepTimer = 0; }

      // UFO shoots
      ufo.shootTimer -= dt;
      if (ufo.shootTimer <= 0) {
        ufo.shootTimer = cfg.aimed ? 65 : 90;
        const bspd = 3.8;
        if (cfg.aimed && !ship.dead) {
          const dx = ship.x - ufo.x, dy = ship.y - ufo.y;
          const d = Math.sqrt(dx*dx+dy*dy) || 1;
          const half = Math.floor(cfg.spread / 2);
          for (let s = -half; s <= half; s++) {
            const ang = Math.atan2(dy, dx) + s * 0.22;
            state.ufoBullets.push({ x: ufo.x, y: ufo.y, vx: Math.cos(ang)*bspd, vy: Math.sin(ang)*bspd, life: 110 });
          }
        } else {
          const ang = randAngle();
          state.ufoBullets.push({ x: ufo.x, y: ufo.y, vx: Math.cos(ang)*bspd, vy: Math.sin(ang)*bspd, life: 110 });
        }
      }
    }
  }

  // ── UFO bullets move ──────────────────────────────────────────────────────
  for (let i = state.ufoBullets.length-1; i >= 0; i--) {
    const b = state.ufoBullets[i];
    b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
    if (b.life <= 0 || b.x < -20 || b.x > W+20 || b.y < -20 || b.y > H+20)
      state.ufoBullets.splice(i,1);
  }

  // ── Collisions: player bullets vs asteroids ───────────────────────────────
  bulletLoop:
  for (let bi = state.bullets.length-1; bi >= 0; bi--) {
    const b = state.bullets[bi];
    for (let ai = state.asteroids.length-1; ai >= 0; ai--) {
      const a = state.asteroids[ai];
      if (dist(b.x,b.y,a.x,a.y) < RADII[a.size] * 0.95) {
        state.score += AST_POINTS[a.size];
        checkExtraLife();
        spawnParticles(a.x,a.y,'#cccccc',10,3);
        if (a.size === 3) sfxBigAst();
        else if (a.size === 2) sfxMedAst();
        else sfxSmallAst();
        if (a.size > 1) {
          for (let s = 0; s < 2; s++) {
            const ang = randAngle(), spd = (0.9+Math.random()*1.1) * cfg.speed;
            state.asteroids.push(newAsteroid(a.x, a.y, a.size-1, Math.cos(ang)*spd, Math.sin(ang)*spd));
          }
        }
        state.asteroids.splice(ai,1);
        state.bullets.splice(bi,1);
        continue bulletLoop;
      }
    }
    // vs UFO
    if (state.ufo && dist(b.x,b.y,state.ufo.x,state.ufo.y) < 24) {
      state.score += UFO_POINTS;
      checkExtraLife();
      spawnParticles(state.ufo.x,state.ufo.y,'#ffee00',18,4);
      sfxUFOHit();
      state.ufo = null;
      state.bullets.splice(bi,1);
      continue bulletLoop;
    }
  }

  // ── Collisions: ship vs threats ───────────────────────────────────────────
  if (!ship.dead && ship.invTimer <= 0) {
    for (const a of state.asteroids) {
      if (dist(ship.x,ship.y,a.x,a.y) < RADII[a.size] * 0.88 + 9) { killShip(); break; }
    }
    if (!ship.dead && state.ufo && dist(ship.x,ship.y,state.ufo.x,state.ufo.y) < 32) killShip();
    if (!ship.dead) {
      for (let i = state.ufoBullets.length-1; i >= 0; i--) {
        const b = state.ufoBullets[i];
        if (dist(ship.x,ship.y,b.x,b.y) < 12) {
          state.ufoBullets.splice(i,1);
          killShip(); break;
        }
      }
    }
  }

  updateParticles(dt);

  // Flash message
  if (state.flashTimer > 0) state.flashTimer -= dt;

  // ── Level clear check ─────────────────────────────────────────────────────
  if (state.asteroids.length === 0 && !state.ufo) {
    if (state.level + 1 >= LEVELS.length) triggerWin();
    else triggerLevelUp();
  }

  // Update HUD
  UI.score.textContent = `SCORE: ${fmtScore(state.score)}`;
}

// ── Draw ──────────────────────────────────────────────────────────────────────
const STARS_BG = Array.from({length:150}, () => ({
  x: Math.random()*W, y: Math.random()*H,
  s: Math.random()*1.4+0.3, a: Math.random()*0.7+0.2,
}));

function drawShip(ship) {
  if (ship.dead) return;
  if (ship.invTimer > 0 && Math.floor(ship.invTimer / 5) % 2 === 0) return;

  ctx.save();
  ctx.translate(ship.x, ship.y);
  ctx.rotate(ship.angle);

  ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 14;
  ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(16,0); ctx.lineTo(-11,-8); ctx.lineTo(-6,0); ctx.lineTo(-11,8);
  ctx.closePath(); ctx.stroke();

  if (ship.thrusting) {
    ctx.shadowColor = '#ff6600';
    ctx.strokeStyle = '#ff8800'; ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(-6,-4); ctx.lineTo(-18 - Math.random()*7, 0); ctx.lineTo(-6,4);
    ctx.stroke();
  }
  ctx.restore();
}

function drawAsteroid(a) {
  ctx.save();
  ctx.translate(a.x, a.y); ctx.rotate(a.rot);
  const bright = a.size === 3 ? '#cccccc' : a.size === 2 ? '#aaaaaa' : '#888888';
  ctx.strokeStyle = bright; ctx.lineWidth = 2;
  ctx.shadowColor = bright; ctx.shadowBlur = 4;
  ctx.beginPath();
  ctx.moveTo(a.verts[0][0], a.verts[0][1]);
  for (let i = 1; i < a.verts.length; i++) ctx.lineTo(a.verts[i][0], a.verts[i][1]);
  ctx.closePath(); ctx.stroke();
  ctx.restore();
}

function drawUFO(ufo) {
  if (!ufo) return;
  ctx.save();
  ctx.translate(ufo.x, ufo.y);
  ctx.strokeStyle = '#ffee00'; ctx.lineWidth = 2;
  ctx.shadowColor = '#ffee00'; ctx.shadowBlur = 14;
  // Main body ellipse
  ctx.beginPath(); ctx.ellipse(0, 6, 22, 8, 0, 0, Math.PI*2); ctx.stroke();
  // Top dome
  ctx.beginPath(); ctx.ellipse(0, 0, 13, 9, 0, Math.PI, 0); ctx.stroke();
  // Lights
  ctx.fillStyle = '#ff4400';
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath(); ctx.arc(i*9, 6, 2, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawBullet(b, color) {
  ctx.beginPath();
  ctx.arc(b.x, b.y, 2.5, 0, Math.PI*2);
  ctx.fillStyle = color;
  ctx.shadowColor = color; ctx.shadowBlur = 7;
  ctx.fill();
  ctx.shadowBlur = 0;
}

function draw() {
  ctx.fillStyle = '#000006';
  ctx.fillRect(0,0,W,H);

  // Stars
  for (const s of STARS_BG) {
    ctx.fillStyle = `rgba(255,255,255,${s.a})`;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }

  for (const a of state.asteroids) drawAsteroid(a);
  drawUFO(state.ufo);
  drawShip(state.ship);

  for (const b of state.bullets)    drawBullet(b, '#ffffff');
  for (const b of state.ufoBullets) drawBullet(b, '#ff4400');

  drawParticles();

  // Lives display
  const liveStr = '△ '.repeat(Math.max(0, state.lives));
  UI.lives.textContent = liveStr.trim();

  // Hi-score
  ctx.fillStyle = '#ffffff22';
  ctx.font = '11px Courier New';
  ctx.textAlign = 'right';
  ctx.fillText(`HI: ${fmtScore(state.hiScore)}`, W-10, H-7);
  ctx.textAlign = 'left';
  ctx.fillText(`ENEMIES: ${state.asteroids.length + (state.ufo ? 1 : 0)}`, 10, H-7);

  // Level title bottom center
  ctx.fillStyle = '#ffffff22'; ctx.textAlign = 'center';
  ctx.fillText(LEVELS[state.level]?.title ?? '', W/2, H-7);
  ctx.textAlign = 'left';

  // Flash message
  if (state.flashTimer > 0) {
    ctx.globalAlpha = Math.min(1, state.flashTimer / 30);
    ctx.font = 'bold 20px Courier New';
    ctx.fillStyle = state.flashColor || '#fff';
    ctx.textAlign = 'center';
    ctx.shadowColor = state.flashColor || '#fff'; ctx.shadowBlur = 12;
    ctx.fillText(state.flashMsg, W/2, H/2 - 40);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  // ESC hint
  ctx.fillStyle = '#ffffff11'; ctx.font = '10px Courier New';
  ctx.fillText('ESC: Pause', 10, 28);
}

// ── Game Loop ─────────────────────────────────────────────────────────────────
function loop(ts) {
  update(ts);
  draw();
  requestAnimationFrame(loop);
}

// ── Input ─────────────────────────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') e.preventDefault();
  if (e.key === 'Escape') {
    if (state.phase === 'playing') {
      state.phase = 'paused';
      showOverlay(
        '<h2 style="color:#aaa">PAUSED</h2><p>Press ESC or Resume</p>',
        'RESUME',
        () => { state.phase = 'playing'; lastTime = performance.now(); }
      );
    } else if (state.phase === 'paused') {
      clearOverlay(); state.phase = 'playing'; lastTime = performance.now();
    }
  }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

// ── Start ─────────────────────────────────────────────────────────────────────
UI.startBtn.onclick = () => {
  initAudio();
  clearOverlay();
  initGame();
  loadLevel(0);
  state.phase = 'playing';
  lastTime = performance.now();
  requestAnimationFrame(loop);
};

// Pre-init for hi-score persistence
state = { hiScore: 0 };
</script>
</body>
</html>
