<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Space Invaders</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }
    #gameContainer {
      position: relative;
    }
    canvas {
      display: block;
      border: 1px solid #1a1a2e;
      box-shadow: 0 0 30px #00ffff44;
    }
    #ui {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      background: rgba(0,0,0,0.7);
      color: #00ffff;
      font-size: 14px;
      letter-spacing: 1px;
      pointer-events: none;
    }
    #ui span { min-width: 120px; }
    #ui .center { text-align: center; flex: 1; }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.85);
      color: #fff;
      text-align: center;
      gap: 16px;
    }
    #overlay h1 { font-size: 48px; color: #00ffff; text-shadow: 0 0 20px #00ffff; }
    #overlay h2 { font-size: 32px; color: #ff4444; text-shadow: 0 0 15px #ff4444; }
    #overlay p { font-size: 16px; color: #aaa; max-width: 500px; line-height: 1.6; }
    #overlay .legend { font-size: 13px; color: #888; }
    #overlay button {
      padding: 12px 40px;
      font-size: 18px;
      font-family: 'Courier New', monospace;
      background: transparent;
      border: 2px solid #00ffff;
      color: #00ffff;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: all 0.2s;
    }
    #overlay button:hover {
      background: #00ffff22;
      box-shadow: 0 0 15px #00ffff;
    }
    .lives { color: #ff6b6b; }
    .score { color: #ffd700; }
    .level-badge { color: #a78bfa; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div id="gameContainer">
  <canvas id="canvas"></canvas>
  <div id="ui">
    <span class="score">SCORE: <span id="scoreDisplay">0</span></span>
    <span class="center level-badge">LEVEL <span id="levelDisplay">1</span></span>
    <span class="lives">&#9829; &#9829; &#9829; <span id="livesDisplay"></span></span>
  </div>
  <div id="overlay">
    <h1>SPACE INVADERS</h1>
    <p>Defend Earth across 5 increasingly brutal waves of alien invaders.</p>
    <div class="legend">
      <p>&#8592; &#8594; Move &nbsp;|&nbsp; SPACE Shoot &nbsp;|&nbsp; ESC Pause</p>
      <p style="margin-top:8px">
        <span style="color:#00ff88">&#9632;</span> Basic (10pts) &nbsp;
        <span style="color:#ff9900">&#9632;</span> Fast (20pts) &nbsp;
        <span style="color:#ff44ff">&#9632;</span> Tank (30pts) &nbsp;
        <span style="color:#ff2222">&#9632;</span> Boss (500pts)
      </p>
    </div>
    <button id="startBtn">START GAME</button>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = 800, H = 600;
canvas.width = W;
canvas.height = H;

const ui = {
  score: document.getElementById('scoreDisplay'),
  level: document.getElementById('levelDisplay'),
  lives: document.getElementById('livesDisplay'),
  overlay: document.getElementById('overlay'),
  startBtn: document.getElementById('startBtn'),
};

// ─── Audio ────────────────────────────────────────────────────────────────────
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }
function playTone(freq, type, duration, vol = 0.15) {
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    o.start(); o.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}
function sfxShoot()  { playTone(440, 'square', 0.1, 0.1); }
function sfxHit()    { playTone(180, 'sawtooth', 0.15, 0.2); }
function sfxExplode(){ playTone(80, 'sawtooth', 0.4, 0.25); }
function sfxLevelUp(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,'sine',0.3,0.2),i*120)); }
function sfxDie()    { [300,250,200,150].forEach((f,i)=>setTimeout(()=>playTone(f,'sawtooth',0.2,0.25),i*100)); }

// ─── Starfield ─────────────────────────────────────────────────────────────
const STARS = Array.from({length:150},()=>({
  x: Math.random()*W, y: Math.random()*H,
  size: Math.random()*1.5+0.5,
  speed: Math.random()*0.4+0.1,
  alpha: Math.random()*0.7+0.3
}));
function drawStars() {
  for (const s of STARS) {
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${s.alpha})`;
    ctx.fill();
    s.y += s.speed;
    if (s.y > H) { s.y = 0; s.x = Math.random()*W; }
  }
}

// ─── Level Config ─────────────────────────────────────────────────────────────
const LEVELS = [
  {
    num: 1,
    title: "First Contact",
    rows: 2, cols: 8,
    alienTypes: ['basic'],
    alienSpeed: 0.4, dropAmount: 20,
    alienShootChance: 0.0003,
    hasShields: true, shieldCount: 3,
    hasBoss: false,
    bgColor: '#000008',
  },
  {
    num: 2,
    title: "Escalation",
    rows: 3, cols: 9,
    alienTypes: ['basic','fast'],
    alienSpeed: 0.55, dropAmount: 22,
    alienShootChance: 0.0006,
    hasShields: true, shieldCount: 3,
    hasBoss: false,
    bgColor: '#000010',
  },
  {
    num: 3,
    title: "Armada",
    rows: 4, cols: 10,
    alienTypes: ['basic','fast','tank'],
    alienSpeed: 0.7, dropAmount: 24,
    alienShootChance: 0.001,
    hasShields: true, shieldCount: 2,
    hasBoss: false,
    bgColor: '#050010',
  },
  {
    num: 4,
    title: "Blitz",
    rows: 4, cols: 11,
    alienTypes: ['fast','tank','fast'],
    alienSpeed: 0.9, dropAmount: 26,
    alienShootChance: 0.0015,
    hasShields: true, shieldCount: 2,
    hasBoss: false,
    bgColor: '#0a0005',
  },
  {
    num: 5,
    title: "The Overlord",
    rows: 3, cols: 10,
    alienTypes: ['basic','fast','tank'],
    alienSpeed: 1.0, dropAmount: 20,
    alienShootChance: 0.001,
    hasShields: true, shieldCount: 2,
    hasBoss: true,
    bgColor: '#08000a',
  },
];

// ─── Alien type definitions ──────────────────────────────────────────────────
const ALIEN_DEF = {
  basic: { color: '#00ff88', points: 10, hp: 1, shootColor: '#00ff88',
    draw(x,y,w,h,t) {
      ctx.fillStyle = this.color;
      ctx.fillRect(x+w*0.2, y+h*0.1, w*0.6, h*0.3);
      ctx.fillRect(x+w*0.1, y+h*0.35, w*0.8, h*0.35);
      ctx.fillRect(x, y+h*0.6, w*0.25, h*0.3);
      ctx.fillRect(x+w*0.75, y+h*0.6, w*0.25, h*0.3);
      // antenna
      ctx.fillRect(x+w*0.35, y, w*0.1, h*0.15);
      ctx.fillRect(x+w*0.55, y, w*0.1, h*0.15);
    }
  },
  fast: { color: '#ff9900', points: 20, hp: 1, shootColor: '#ffcc00',
    draw(x,y,w,h,t) {
      ctx.fillStyle = this.color;
      // diamond-ish
      ctx.beginPath();
      ctx.moveTo(x+w/2, y);
      ctx.lineTo(x+w, y+h*0.5);
      ctx.lineTo(x+w*0.75, y+h);
      ctx.lineTo(x+w*0.25, y+h);
      ctx.lineTo(x, y+h*0.5);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.fillRect(x+w*0.3, y+h*0.35, w*0.15, h*0.25);
      ctx.fillRect(x+w*0.55, y+h*0.35, w*0.15, h*0.25);
    }
  },
  tank: { color: '#ff44ff', points: 30, hp: 2, shootColor: '#ff99ff',
    draw(x,y,w,h,t) {
      ctx.fillStyle = this.color;
      ctx.fillRect(x+w*0.1, y+h*0.05, w*0.8, h*0.9);
      ctx.fillStyle = '#000';
      ctx.fillRect(x+w*0.25, y+h*0.2, w*0.2, h*0.25);
      ctx.fillRect(x+w*0.55, y+h*0.2, w*0.2, h*0.25);
      ctx.fillStyle = this.color;
      ctx.fillRect(x, y+h*0.3, w*0.12, h*0.4);
      ctx.fillRect(x+w*0.88, y+h*0.3, w*0.12, h*0.4);
    }
  }
};

// ─── Game State ──────────────────────────────────────────────────────────────
let state, keys, particles;

function initGame() {
  keys = {};
  particles = [];
  state = {
    phase: 'playing',  // playing | paused | levelup | gameover | win
    level: 0,
    score: 0,
    hiScore: state?.hiScore || 0,
    lives: 3,
    player: null,
    aliens: [],
    playerBullets: [],
    alienBullets: [],
    shields: [],
    boss: null,
    bossActive: false,
    alienDir: 1,
    alienMoveTimer: 0,
    alienMoveInterval: 60,
    flashTimer: 0,
    levelTransTimer: 0,
  };
  loadLevel(0);
}

function loadLevel(idx) {
  const cfg = LEVELS[idx];
  state.level = idx;
  state.playerBullets = [];
  state.alienBullets = [];
  state.particles = [];
  particles = [];
  state.alienDir = 1;
  state.boss = null;
  state.bossActive = false;
  state.alienMoveInterval = Math.max(10, 60 - idx * 8);

  // Player
  if (!state.player) {
    state.player = { x: W/2 - 20, y: H - 60, w: 40, h: 30, speed: 4, shootCooldown: 0 };
  } else {
    state.player.x = W/2 - 20;
    state.player.y = H - 60;
    state.player.shootCooldown = 0;
  }

  // Aliens
  state.aliens = [];
  const alienW = 36, alienH = 28, padX = 10, padY = 8;
  const totalW = cfg.cols * (alienW + padX);
  const startX = (W - totalW) / 2;
  const startY = 70;

  for (let r = 0; r < cfg.rows; r++) {
    const typeIdx = Math.min(r, cfg.alienTypes.length - 1);
    const typeName = cfg.alienTypes[typeIdx];
    const def = ALIEN_DEF[typeName];
    for (let c = 0; c < cfg.cols; c++) {
      state.aliens.push({
        x: startX + c * (alienW + padX),
        y: startY + r * (alienH + padY),
        w: alienW, h: alienH,
        typeName, def,
        hp: def.hp,
        alive: true,
        animT: Math.random() * Math.PI * 2,
      });
    }
  }

  // Shields
  state.shields = [];
  if (cfg.hasShields) {
    const sW = 64, sH = 40;
    const gap = W / (cfg.shieldCount + 1);
    for (let i = 0; i < cfg.shieldCount; i++) {
      const sx = gap * (i + 1) - sW / 2;
      const sy = H - 130;
      const blocks = [];
      // Build shield from grid of small blocks
      const bW = 8, bR = sW/bW, bC = sH/bW;
      for (let br = 0; br < bC; br++) {
        for (let bc = 0; bc < bR; bc++) {
          // Notch bottom center
          if (br >= bC - 2 && bc >= bR*0.3 && bc <= bR*0.7) continue;
          // Rounded corners
          if (br < 2) {
            if (bc < 2 || bc >= bR-2) continue;
          }
          blocks.push({ x: sx+bc*bW, y: sy+br*bW, w: bW, h: bW, hp: 3 });
        }
      }
      state.shields.push({ blocks });
    }
  }

  // Boss (level 5)
  if (cfg.hasBoss) {
    state.boss = {
      x: W/2 - 60, y: 60, w: 120, h: 55,
      hp: 30, maxHp: 30,
      speed: 1.2, dir: 1,
      shootTimer: 0, shootInterval: 90,
      phase: 1,  // phase changes as hp drops
      alive: true,
    };
    state.bossActive = true;
  }

  ui.level.textContent = idx + 1;
}

// ─── Particle ──────────────────────────────────────────────────────────────
function spawnParticles(x, y, color, count = 12) {
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
    const speed = Math.random() * 3 + 1;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      alpha: 1,
      size: Math.random() * 3 + 1,
      color,
      decay: Math.random() * 0.02 + 0.02,
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.05;
    p.alpha -= p.decay;
    if (p.alpha <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

// ─── Draw Helpers ────────────────────────────────────────────────────────────
function drawPlayer(p) {
  // Glow
  ctx.shadowColor = '#00ffff';
  ctx.shadowBlur = 15;
  ctx.fillStyle = '#00ffff';
  // Body
  ctx.fillRect(p.x + 12, p.y + 10, 16, 20);
  // Wings
  ctx.fillRect(p.x, p.y + 18, 12, 12);
  ctx.fillRect(p.x + 28, p.y + 18, 12, 12);
  // Nose
  ctx.fillRect(p.x + 17, p.y, 6, 12);
  // Cockpit
  ctx.fillStyle = '#003344';
  ctx.fillRect(p.x + 14, p.y + 12, 12, 10);
  ctx.shadowBlur = 0;
}

function drawBoss(b) {
  if (!b || !b.alive) return;
  ctx.shadowColor = '#ff0044';
  ctx.shadowBlur = 20;

  // Body
  ctx.fillStyle = '#cc0022';
  ctx.fillRect(b.x + 10, b.y + 10, b.w - 20, b.h - 15);

  // Wings
  ctx.fillStyle = '#880011';
  ctx.fillRect(b.x, b.y + 20, 20, b.h - 25);
  ctx.fillRect(b.x + b.w - 20, b.y + 20, 20, b.h - 25);

  // Head dome
  ctx.fillStyle = '#ff2244';
  ctx.beginPath();
  ctx.ellipse(b.x + b.w/2, b.y + 20, 35, 22, 0, Math.PI, 0);
  ctx.fill();

  // Eyes
  ctx.fillStyle = '#ffff00';
  ctx.fillRect(b.x + 30, b.y + 10, 14, 10);
  ctx.fillRect(b.x + b.w - 44, b.y + 10, 14, 10);
  ctx.fillStyle = '#ff4400';
  ctx.fillRect(b.x + 34, b.y + 12, 6, 6);
  ctx.fillRect(b.x + b.w - 40, b.y + 12, 6, 6);

  // Cannons
  ctx.fillStyle = '#555';
  ctx.fillRect(b.x + 20, b.y + b.h - 5, 8, 12);
  ctx.fillRect(b.x + b.w/2 - 4, b.y + b.h - 5, 8, 15);
  ctx.fillRect(b.x + b.w - 28, b.y + b.h - 5, 8, 12);

  // HP bar
  const barW = b.w;
  const hpRatio = b.hp / b.maxHp;
  ctx.fillStyle = '#330000';
  ctx.fillRect(b.x, b.y - 14, barW, 8);
  ctx.fillStyle = hpRatio > 0.5 ? '#00ff44' : hpRatio > 0.25 ? '#ffaa00' : '#ff2200';
  ctx.fillRect(b.x, b.y - 14, barW * hpRatio, 8);
  ctx.strokeStyle = '#ff4444';
  ctx.strokeRect(b.x, b.y - 14, barW, 8);

  ctx.shadowBlur = 0;
}

function drawShields() {
  for (const shield of state.shields) {
    for (const b of shield.blocks) {
      const alpha = b.hp / 3;
      ctx.fillStyle = `rgba(0,200,100,${alpha})`;
      ctx.fillRect(b.x, b.y, b.w, b.h);
    }
  }
}

function drawBullet(b, color) {
  ctx.shadowColor = color;
  ctx.shadowBlur = 8;
  ctx.fillStyle = color;
  ctx.fillRect(b.x - 2, b.y - 6, 4, 12);
  ctx.shadowBlur = 0;
}

// ─── Collision ───────────────────────────────────────────────────────────────
function rectHit(ax,ay,aw,ah, bx,by,bw,bh) {
  return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
}

// ─── Update ──────────────────────────────────────────────────────────────────
let lastTime = 0;
function update(ts) {
  const dt = Math.min((ts - lastTime) / 16.67, 3);
  lastTime = ts;

  if (state.phase !== 'playing') return;

  const cfg = LEVELS[state.level];
  const p = state.player;

  // Player movement
  if (keys['ArrowLeft'] || keys['a']) p.x = Math.max(0, p.x - p.speed * dt);
  if (keys['ArrowRight'] || keys['d']) p.x = Math.min(W - p.w, p.x + p.speed * dt);

  // Player shoot
  p.shootCooldown = Math.max(0, p.shootCooldown - dt);
  if ((keys[' '] || keys['Space']) && p.shootCooldown === 0) {
    state.playerBullets.push({ x: p.x + p.w/2, y: p.y, speed: 9 });
    p.shootCooldown = 15;
    sfxShoot();
  }

  // Player bullets
  for (let i = state.playerBullets.length - 1; i >= 0; i--) {
    const b = state.playerBullets[i];
    b.y -= b.speed * dt;
    if (b.y < 0) { state.playerBullets.splice(i, 1); continue; }

    // Hit alien
    let hit = false;
    for (let j = state.aliens.length - 1; j >= 0; j--) {
      const a = state.aliens[j];
      if (!a.alive) continue;
      if (rectHit(b.x-2,b.y-6,4,12, a.x,a.y,a.w,a.h)) {
        a.hp--;
        spawnParticles(a.x+a.w/2, a.y+a.h/2, a.def.color, 8);
        if (a.hp <= 0) {
          a.alive = false;
          state.score += a.def.points;
          sfxExplode();
          spawnParticles(a.x+a.w/2, a.y+a.h/2, a.def.color, 16);
        } else {
          sfxHit();
        }
        state.playerBullets.splice(i, 1);
        hit = true;
        break;
      }
    }
    if (hit) continue;

    // Hit boss
    if (state.bossActive && state.boss && state.boss.alive) {
      const b2 = state.boss;
      if (rectHit(b.x-2,b.y-6,4,12, b2.x,b2.y,b2.w,b2.h)) {
        b2.hp--;
        spawnParticles(b.x, b.y, '#ff4444', 6);
        sfxHit();
        state.playerBullets.splice(i, 1);
        if (b2.hp <= 0) {
          b2.alive = false;
          state.score += 500;
          sfxExplode();
          spawnParticles(b2.x+b2.w/2, b2.y+b2.h/2, '#ff4444', 40);
        }
        continue;
      }
    }

    // Hit shield
    for (const shield of state.shields) {
      let sh = false;
      for (let k = shield.blocks.length - 1; k >= 0; k--) {
        const bl = shield.blocks[k];
        if (rectHit(b.x-2,b.y-6,4,12, bl.x,bl.y,bl.w,bl.h)) {
          bl.hp--;
          if (bl.hp <= 0) shield.blocks.splice(k, 1);
          state.playerBullets.splice(i, 1);
          sh = true; break;
        }
      }
      if (sh) { hit = true; break; }
    }
  }

  // Alien movement
  state.alienMoveTimer += dt;
  const liveAliens = state.aliens.filter(a => a.alive);
  if (state.alienMoveTimer >= state.alienMoveInterval) {
    state.alienMoveTimer = 0;
    const step = (3 + liveAliens.length * 0.02) * state.alienDir;
    let drop = false;
    for (const a of state.aliens) {
      if (!a.alive) continue;
      a.x += step;
    }
    // Check wall collision
    for (const a of state.aliens) {
      if (!a.alive) continue;
      if (a.x + a.w > W - 5 || a.x < 5) { drop = true; break; }
    }
    if (drop) {
      state.alienDir *= -1;
      for (const a of state.aliens) {
        if (!a.alive) continue;
        a.y += cfg.dropAmount;
        a.x -= step; // undo last step
      }
    }
    // Alien anim
    for (const a of state.aliens) a.animT += 0.4;
    // Adapt speed based on remaining
    const remaining = liveAliens.length;
    state.alienMoveInterval = Math.max(5, 20 + remaining * 0.8 - state.level * 2);
  }

  // Alien shooting
  for (const a of liveAliens) {
    if (Math.random() < cfg.alienShootChance * dt) {
      state.alienBullets.push({
        x: a.x + a.w/2, y: a.y + a.h,
        speed: 3 + state.level * 0.5,
        color: a.def.shootColor
      });
    }
  }

  // Boss movement & shooting
  if (state.bossActive && state.boss && state.boss.alive) {
    const b2 = state.boss;
    const phaseRatio = b2.hp / b2.maxHp;
    const bossSpeed = b2.speed * (1 + (1 - phaseRatio) * 1.5);
    b2.x += bossSpeed * b2.dir * dt;
    if (b2.x + b2.w > W - 10) { b2.dir = -1; b2.y = Math.min(b2.y + 5, 100); }
    if (b2.x < 10) { b2.dir = 1; b2.y = Math.min(b2.y + 5, 100); }

    b2.shootTimer += dt;
    const shootInterv = b2.shootInterval * phaseRatio;
    if (b2.shootTimer >= shootInterv) {
      b2.shootTimer = 0;
      // Shoot spread in phase 2 (<50% hp)
      if (phaseRatio < 0.5) {
        for (let angle = -0.3; angle <= 0.3; angle += 0.3) {
          state.alienBullets.push({
            x: b2.x + b2.w/2, y: b2.y + b2.h,
            vx: Math.sin(angle) * 3, vy: 4 + state.level * 0.3,
            speed: 0, color: '#ff4444'
          });
        }
      } else {
        state.alienBullets.push({
          x: b2.x + b2.w/2, y: b2.y + b2.h,
          speed: 4, color: '#ff4444'
        });
      }
    }
  }

  // Alien bullets
  for (let i = state.alienBullets.length - 1; i >= 0; i--) {
    const b = state.alienBullets[i];
    if (b.vx !== undefined) {
      b.x += b.vx * dt; b.y += b.vy * dt;
    } else {
      b.y += b.speed * dt;
    }
    if (b.y > H) { state.alienBullets.splice(i, 1); continue; }

    // Hit player
    if (rectHit(b.x-2,b.y-6,4,12, p.x,p.y,p.w,p.h)) {
      state.alienBullets.splice(i, 1);
      playerHit();
      continue;
    }

    // Hit shield
    let sh = false;
    for (const shield of state.shields) {
      for (let k = shield.blocks.length - 1; k >= 0; k--) {
        const bl = shield.blocks[k];
        if (rectHit(b.x-2,b.y-6,4,12, bl.x,bl.y,bl.w,bl.h)) {
          bl.hp--;
          if (bl.hp <= 0) shield.blocks.splice(k, 1);
          state.alienBullets.splice(i, 1);
          sh = true; break;
        }
      }
      if (sh) break;
    }
    if (sh) continue;
  }

  // Aliens reach bottom
  for (const a of state.aliens) {
    if (a.alive && a.y + a.h >= p.y) {
      triggerGameOver();
      return;
    }
  }

  updateParticles();

  // Check level cleared
  const anyAlive = state.aliens.some(a => a.alive) || (state.bossActive && state.boss && state.boss.alive);
  if (!anyAlive) {
    if (state.level + 1 >= LEVELS.length) {
      triggerWin();
    } else {
      triggerLevelUp();
    }
  }

  // Update score/lives UI
  ui.score.textContent = state.score.toString().padStart(6, '0');
  ui.lives.textContent = ''; // drawn per canvas
}

function playerHit() {
  spawnParticles(state.player.x + state.player.w/2, state.player.y + state.player.h/2, '#00ffff', 20);
  sfxDie();
  state.lives--;
  if (state.lives <= 0) {
    triggerGameOver();
  } else {
    state.player.x = W/2 - 20;
    state.flashTimer = 120;
  }
}

function triggerLevelUp() {
  state.phase = 'levelup';
  sfxLevelUp();
  showOverlayLevelUp();
}

function triggerGameOver() {
  state.phase = 'gameover';
  if (state.score > state.hiScore) state.hiScore = state.score;
  sfxDie();
  showOverlayGameOver();
}

function triggerWin() {
  state.phase = 'win';
  if (state.score > state.hiScore) state.hiScore = state.score;
  sfxLevelUp();
  showOverlayWin();
}

// ─── Overlay helpers ─────────────────────────────────────────────────────────
function clearOverlay() {
  ui.overlay.innerHTML = '';
  ui.overlay.classList.add('hidden');
}

function showOverlay(html, btnText, onBtn) {
  ui.overlay.innerHTML = html + `<button id="actionBtn">${btnText}</button>`;
  ui.overlay.classList.remove('hidden');
  document.getElementById('actionBtn').onclick = () => { initAudio(); clearOverlay(); onBtn(); };
}

function showOverlayLevelUp() {
  const next = LEVELS[state.level + 1];
  showOverlay(
    `<h2>LEVEL CLEAR!</h2>
     <p style="color:#ffd700;font-size:22px">+ BONUS: ${(state.level+1)*200} PTS</p>
     <p>Incoming: <strong style="color:#a78bfa">${next.title}</strong></p>
     <p>${next.hasBoss ? '⚠️ BOSS DETECTED ⚠️' : `${next.rows * next.cols} invaders — increased firepower`}</p>`,
    'NEXT LEVEL',
    () => {
      state.score += (state.level + 1) * 200;
      loadLevel(state.level + 1);
      state.phase = 'playing';
    }
  );
}

function showOverlayGameOver() {
  showOverlay(
    `<h2>GAME OVER</h2>
     <p class="score" style="font-size:20px">SCORE: ${state.score.toString().padStart(6,'0')}</p>
     <p style="color:#888">HI-SCORE: ${state.hiScore.toString().padStart(6,'0')}</p>`,
    'PLAY AGAIN',
    () => { initGame(); }
  );
}

function showOverlayWin() {
  showOverlay(
    `<h1 style="color:#ffd700">VICTORY!</h1>
     <p style="font-size:18px;color:#aaa">Earth is safe... for now.</p>
     <p class="score" style="font-size:22px">FINAL SCORE: ${state.score.toString().padStart(6,'0')}</p>
     <p style="color:#888">HI-SCORE: ${state.hiScore.toString().padStart(6,'0')}</p>`,
    'PLAY AGAIN',
    () => { initGame(); }
  );
}

function showPauseOverlay() {
  ui.overlay.innerHTML = `
    <h2 style="color:#a78bfa">PAUSED</h2>
    <p>Press <strong>ESC</strong> or click Resume to continue</p>
    <button id="actionBtn">RESUME</button>`;
  ui.overlay.classList.remove('hidden');
  document.getElementById('actionBtn').onclick = () => {
    clearOverlay();
    state.phase = 'playing';
    lastTime = performance.now();
  };
}

// ─── Draw ────────────────────────────────────────────────────────────────────
function draw() {
  const cfg = LEVELS[state.level] || LEVELS[0];
  ctx.fillStyle = cfg.bgColor;
  ctx.fillRect(0, 0, W, H);

  drawStars();

  // Ground line
  ctx.fillStyle = '#1a4a1a';
  ctx.fillRect(0, H - 20, W, 3);

  drawShields();

  // Aliens
  for (const a of state.aliens) {
    if (!a.alive) continue;
    ctx.shadowBlur = 0;
    a.def.draw(a.x, a.y, a.w, a.h, a.animT);
    // Damage indicator for tanks
    if (a.typeName === 'tank' && a.hp < a.def.hp) {
      ctx.strokeStyle = '#ff000088';
      ctx.lineWidth = 2;
      ctx.strokeRect(a.x, a.y, a.w, a.h);
      ctx.lineWidth = 1;
    }
  }

  drawBoss(state.boss);

  // Player (flash when hit)
  if (state.flashTimer > 0) {
    state.flashTimer--;
    if (Math.floor(state.flashTimer / 6) % 2 === 0) drawPlayer(state.player);
  } else {
    drawPlayer(state.player);
  }

  // Bullets
  for (const b of state.playerBullets) drawBullet(b, '#ffffff');
  for (const b of state.alienBullets) {
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 6;
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x - 2, b.y - 5, 4, 10);
    ctx.shadowBlur = 0;
  }

  drawParticles();

  // Lives display on canvas
  for (let i = 0; i < state.lives; i++) {
    ctx.fillStyle = '#00ffff';
    ctx.fillRect(W - 30 - i * 25, H - 16, 20, 12);
  }

  // Level name
  ctx.fillStyle = '#a78bfa44';
  ctx.font = '12px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText(`LEVEL ${state.level+1}: ${cfg.title}`, W/2, H - 6);
  ctx.textAlign = 'left';

  // Alien count
  const alive = state.aliens.filter(a=>a.alive).length + (state.bossActive && state.boss?.alive ? 1 : 0);
  ctx.fillStyle = '#ff444444';
  ctx.font = '11px Courier New';
  ctx.fillText(`ENEMIES: ${alive}`, 10, H - 6);

  // HI-SCORE
  ctx.fillStyle = '#ffffff33';
  ctx.textAlign = 'right';
  ctx.fillText(`HI: ${state.hiScore.toString().padStart(6,'0')}`, W - 10, H - 6);
  ctx.textAlign = 'left';

  // Pause hint
  if (state.phase === 'playing') {
    ctx.fillStyle = '#ffffff11';
    ctx.font = '10px Courier New';
    ctx.fillText('ESC: Pause', 10, 28);
  }
}

// ─── Game Loop ───────────────────────────────────────────────────────────────
function loop(ts) {
  update(ts);
  draw();
  requestAnimationFrame(loop);
}

// ─── Input ───────────────────────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') e.preventDefault();
  if (e.key === 'Escape' && state?.phase === 'playing') {
    state.phase = 'paused';
    showPauseOverlay();
  } else if (e.key === 'Escape' && state?.phase === 'paused') {
    clearOverlay();
    state.phase = 'playing';
    lastTime = performance.now();
  }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

// ─── Start ───────────────────────────────────────────────────────────────────
ui.startBtn.onclick = () => {
  initAudio();
  clearOverlay();
  initGame();
  lastTime = performance.now();
  requestAnimationFrame(loop);
};

// Pre-init state for hi-score
state = { hiScore: 0 };
</script>
</body>
</html>
